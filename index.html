<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        } 
        body{
            background-color: aliceblue;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        } 
        .modal_container{
            position: fixed;
            top: 0;
            left: 0;
            opacity: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; 
            height: 100vh;
            width: 100vw;
        }
        .modal_container.show{
            opacity: 1;
            pointer-events: auto;
        }
        .modal{
            background-color: whitesmoke;
            border-radius: 5px;
            gap: 5px ;
            padding: 30px 50px;
            text-align: center;
            width: 600px;
            max-width: 100%;
        }
        button{
            border: none;
            background-color: black;
            color: white;
            border-radius: 5px;
            font-size: 14px;
            padding: 10px 25px;
        }
        
    </style>
</head>
<body>
    <button id="open">click me please</button>
    <div class="modal_container" id="modal_container">
        <div class="modal">
            <h1>modals are</h1>
            <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Porro culpa dicta suscipit nulla, eos, consectetur voluptate perferendis molestiae odit corporis voluptas laboriosam sint iusto dolorum non laudantium beatae tenetur tempora.</p>
            <button id="close">close me</button>
        </div>
    </div>
    

    <script>
        const open = document.getElementById('open')
        const modal_container = document.getElementById('modal_container')
        const close = document.getElementById('close')
        open.addEventListener('click',()=>{
            modal_container.classList.add('show')
        })
        close.addEventListener('click',()=>{
            modal_container.classList.remove('show')
        })
    </script>
</body>
</html>
